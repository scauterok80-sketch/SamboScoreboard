name: Windows build and test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SamboSecretary.Tests/SamboSecretary.Tests.csproj
      - name: Test
        run: dotnet test SamboSecretary.Tests/SamboSecretary.Tests.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish SamboSecretary/SamboSecretary.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Smoke test executable startup
        run: .\publish\SamboSecretary.exe --selftest
      - name: Package portable version
        shell: powershell
        run: Compress-Archive -Path publish\* -DestinationPath SamboSecretary_Portable_Windows_x64.zip
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: SamboSecretary-Portable-Windows-x64
          path: SamboSecretary_Portable_Windows_x64.zip
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SamboSecretary.iss'
      - name: Smoke test installer and installed application
        shell: powershell
        run: |
          $setup = Resolve-Path ".\installer\output\SamboSecretary_Setup_3.0.0_win64.exe"
          $installDir = Join-Path $env:TEMP "SamboSecretarySmokeInstall"
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }
          $p = Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART",("/DIR="+$installDir) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          $exe = Join-Path $installDir "SamboSecretary.exe"
          if (!(Test-Path $exe)) { throw "Installed SamboSecretary.exe not found" }
          $app = Start-Process $exe -ArgumentList "--selftest" -PassThru -Wait
          if ($app.ExitCode -ne 0) { throw "Installed application self-test failed with code $($app.ExitCode)" }
          $un = Join-Path $installDir "unins000.exe"
          if (Test-Path $un) {
            $u = Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -PassThru -Wait
            if ($u.ExitCode -ne 0) { throw "Uninstaller exit code $($u.ExitCode)" }
          }
      - name: Package installer
        shell: powershell
        run: Compress-Archive -Path installer\output\SamboSecretary_Setup_3.0.0_win64.exe,README_RU.txt -DestinationPath SamboSecretary_3.0.0_Windows_x64.zip
      - name: Upload installer package
        uses: actions/upload-artifact@v4
        with:
          name: SamboSecretary-Installer-Windows-x64
          path: SamboSecretary_3.0.0_Windows_x64.zip

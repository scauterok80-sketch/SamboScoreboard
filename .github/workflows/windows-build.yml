name: Windows build and test
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SamboSecretary.Tests/SamboSecretary.Tests.csproj
      - name: Test
        run: dotnet test SamboSecretary.Tests/SamboSecretary.Tests.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish SamboSecretary/SamboSecretary.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SamboSecretary.iss'
      - name: Package
        shell: powershell
        run: Compress-Archive -Path installer\output\SamboSecretary_Setup_1.0.0_win64.exe,README_RU.txt -DestinationPath SamboSecretary_1.0.0_Windows_x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SamboSecretary-Windows-x64
          path: |
            SamboSecretary_1.0.0_Windows_x64.zip
            installer/output/SamboSecretary_Setup_1.0.0_win64.exe
            README_RU.txt
